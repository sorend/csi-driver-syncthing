apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: syncthingnodes.syncthing-storage.sorend.github.com
spec:
  group: syncthing-storage.sorend.github.com
  scope: Cluster
  names:
    plural: syncthingnodes
    singular: syncthingnode
    kind: SyncthingNode
    listKind: SyncthingNodeList
    shortNames: [stnode]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, deviceID]
              properties:
                nodeName: {type: string}
                deviceID: {type: string}
                addresses:
                  type: array
                  items: {type: string}
            status:
              type: object
              properties:
                ready: {type: boolean}
                syncthingVersion: {type: string}
                observedDeviceID: {type: string}
                lastSeen: {type: string, format: date-time}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-driver-syncthing-manager
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes, storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments/status]
    verbs: [get, update, patch]
  - apiGroups: [syncthing-storage.sorend.github.com]
    resources: [syncthingnodes, syncthingvolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [syncthing-storage.sorend.github.com]
    resources: [syncthingnodes/status, syncthingvolumes/status]
    verbs: [get, update, patch]
  - apiGroups: [syncthing-storage.sorend.github.com]
    resources: [syncthingvolumes/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-driver-syncthing-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-driver-syncthing-manager
subjects:
  - kind: ServiceAccount
    name: csi-driver-syncthing-controller
    namespace: csi-syncthing

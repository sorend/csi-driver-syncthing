apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-driver-syncthing-node-agent
  namespace: csi-syncthing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-driver-syncthing-node-agent
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [syncthing-storage.sorend.github.com]
    resources: [syncthingnodes, syncthingvolumes]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [syncthing-storage.sorend.github.com]
    resources: [syncthingnodes/status, syncthingvolumes/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-driver-syncthing-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-driver-syncthing-node-agent
subjects:
  - kind: ServiceAccount
    name: csi-driver-syncthing-node-agent
    namespace: csi-syncthing

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: syncthingvolumes.syncthing-storage.sorend.github.com
spec:
  group: syncthing-storage.sorend.github.com
  scope: Cluster
  names:
    plural: syncthingvolumes
    singular: syncthingvolume
    kind: SyncthingVolume
    listKind: SyncthingVolumeList
    shortNames: [stvol]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [volumeHandle, folderID]
              properties:
                volumeHandle: {type: string}
                folderID: {type: string}
                desiredReplicas:
                  type: array
                  items:
                    type: object
                    required: [nodeName]
                    properties:
                      nodeName: {type: string}
                      mode: {type: string, enum: [active, cache]}
                initialSync:
                  type: object
                  properties:
                    policy: {type: string, enum: [wait, none]}
                retention:
                  type: object
                  properties:
                    afterDetach: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer, format: int64}
                replicas:
                  type: array
                  items:
                    type: object
                    required: [nodeName, state]
                    properties:
                      nodeName: {type: string}
                      state: {type: string}
                      completion: {type: integer, format: int32}
                      needBytes: {type: integer, format: int64}
                      needItems: {type: integer, format: int64}
                      connected: {type: boolean}
                      configuredRevision: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}

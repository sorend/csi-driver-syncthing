apiVersion: v1
kind: Pod
metadata:
  name: syncthing-example-reader
spec:
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: syncthing-example-writer
          topologyKey: kubernetes.io/hostname
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "tail -n 20 -F /data/activity.log"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: syncthing-example

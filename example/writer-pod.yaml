apiVersion: v1
kind: Pod
metadata:
  name: syncthing-example-writer
  labels:
    app: syncthing-example-writer
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          i=1
          while [ "$i" -le 30 ]; do
            printf '%s writer line %s\n' "$(date -Iseconds)" "$i" >> /data/activity.log
            i=$((i + 1))
            sleep 2
          done
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: syncthing-example

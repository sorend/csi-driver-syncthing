name: Kubernetes storage e2e full suite

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes-storage-e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.33.0

      - name: Run full Kubernetes storage e2e suite
        run: make kubernetes-storage-e2e-full

      - name: Upload full-suite reports and cluster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-storage-e2e-full-artifacts
          path: artifacts/kubernetes-storage-e2e-full/
          if-no-files-found: ignore

      - name: Delete Kind cluster
        if: always()
        run: make kubernetes-storage-e2e-clean
